<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurelia Bazar · animated navbar</title>
  <!-- Google Fonts: Poppins + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  
 
  <!-- ====== SEARCH OVERLAY (working) ====== -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-container">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search for premium essentials..." id="searchInput" autofocus />
      <button class="close-search" id="closeSearchBtn" aria-label="Close search">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <!-- ====== NAVBAR AT TOP ====== -->
  <header class="navbar-wrapper">
    <nav class="navbar" id="mainNavbar">
      <!-- LEFT: Logo -->
      <a href="#" class="logo">
        <i class="fas fa-sparkle"></i> Aurelia Bazar
      </a>

      <!-- CENTER: Navigation links -->
      <ul class="nav-links" id="navLinks">
        <li><a href="#" class="active">Home <span class="dot-indicator"></span></a></li>
        <li><a href="#">Shop <span class="dot-indicator"></span></a></li>
        <li><a href="#">Categories <span class="dot-indicator"></span></a></li>
      </ul>

      <!-- RIGHT: Icons + hamburger -->
      <div class="nav-icons">
        <a href="#" aria-label="Search" id="searchIconBtn">
          <i class="fas fa-search"></i>
        </a>
        <a href="#" aria-label="Cart" class="cart-wrapper">
          <i class="fas fa-shopping-bag"></i>
          <span class="badge">3</span>
        </a>
        <a href="#" aria-label="Profile"><i class="fas fa-user"></i></a>
        <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </nav>
  </header>

  
  <!-- ====== JAVASCRIPT ====== -->
  <script src="assets/js/script.js"></script>

</body>
</html>
