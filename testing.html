<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurelia Bazar · Daily Deals</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ============================================================
       RESET & BASE
    ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #F5F6FA;
      font-family: 'Poppins', 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* ============================================================
       DAILY DEALS SECTION - WHITE PREMIUM
    ============================================================ */
    .daily-deals-section {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 40px;
      padding: 50px 40px 60px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.02), 0 8px 24px rgba(0, 0, 0, 0.01);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .daily-deals-section::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(108, 99, 255, 0.03) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .daily-deals-section::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -40px;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255, 107, 107, 0.03) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .daily-deals-container {
      position: relative;
      z-index: 1;
    }

    /* ----- HEADER ----- */
    .daily-deals-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding: 0 4px;
    }

    .daily-deals-header .title-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .daily-deals-header .title-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #6C63FF, #8B83F0);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      box-shadow: 0 8px 24px rgba(108, 99, 255, 0.15);
    }

    .daily-deals-header .title {
      font-family: 'Poppins', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #1E1E1E;
      letter-spacing: -0.5px;
    }

    .daily-deals-header .title span {
      color: #6C63FF;
    }

    .daily-deals-header .see-all {
      font-family: 'Inter', 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #777;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      padding: 10px 20px;
      border-radius: 40px;
      background: #F5F6FA;
      border: 1px solid transparent;
    }

    .daily-deals-header .see-all i {
      font-size: 12px;
      transition: transform 0.3s ease;
    }

    .daily-deals-header .see-all:hover {
      color: #6C63FF;
      background: rgba(108, 99, 255, 0.04);
      border-color: rgba(108, 99, 255, 0.1);
      transform: translateX(2px);
    }

    .daily-deals-header .see-all:hover i {
      transform: translateX(4px);
    }

    /* ----- SCROLL CONTAINER (Drag to scroll) ----- */
    .daily-deals-scroll {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      padding: 16px 4px 28px 4px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    .daily-deals-scroll::-webkit-scrollbar {
      display: none;
    }

    .daily-deals-scroll.active {
      cursor: grabbing;
    }

    /* ----- PRODUCT CARD - Premium White Concept ----- */
    .deal-card {
      flex: 0 0 210px;
      background: #ffffff;
      border-radius: 28px;
      padding: 20px 18px 18px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02), 0 1px 4px rgba(0, 0, 0, 0.01);
      border: 1px solid rgba(0, 0, 0, 0.03);
      overflow: visible;
    }

    .deal-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.02);
      border-color: rgba(108, 99, 255, 0.08);
    }

    .deal-card:active {
      transform: scale(0.96);
    }

    .deal-card.card-glow-purple {
      background: linear-gradient(145deg, #ffffff, #f8f6ff);
    }
    .deal-card.card-glow-pink {
      background: linear-gradient(145deg, #ffffff, #fff6f8);
    }
    .deal-card.card-glow-blue {
      background: linear-gradient(145deg, #ffffff, #f6faff);
    }
    .deal-card.card-glow-green {
      background: linear-gradient(145deg, #ffffff, #f6fff8);
    }
    .deal-card.card-glow-orange {
      background: linear-gradient(145deg, #ffffff, #fff8f4);
    }
    .deal-card.card-glow-yellow {
      background: linear-gradient(145deg, #ffffff, #fffcf0);
    }

    /* ----- Discount Badge ----- */
    .deal-card .discount-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: linear-gradient(135deg, #ff6b6b, #ff4757);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
      z-index: 2;
      box-shadow: 0 4px 16px rgba(255, 71, 87, 0.15);
    }

    /* ----- Wishlist Heart ----- */
    .deal-card .wishlist-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.04);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
      z-index: 2;
    }

    .deal-card .wishlist-btn:hover {
      background: rgba(255, 71, 87, 0.06);
      color: #ff4757;
      transform: scale(1.1);
      border-color: rgba(255, 71, 87, 0.1);
    }

    /* ----- Product Image ----- */
    .deal-card .product-image-wrap {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      margin-top: -8px;
    }

    .deal-card .product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.02));
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .deal-card:hover .product-image {
      transform: scale(1.08) rotate(-3deg);
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.04));
    }

    /* ----- Product Name ----- */
    .deal-card .product-name {
      font-family: 'Inter', 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #1E1E1E;
      margin-top: 10px;
      line-height: 1.3;
      min-height: 38px;
      position: relative;
      z-index: 1;
    }

    /* ----- Rating Stars ----- */
    .deal-card .rating {
      display: flex;
      gap: 2px;
      margin-top: 4px;
      font-size: 11px;
      color: #feca57;
      z-index: 1;
      position: relative;
    }

    .deal-card .rating .gray {
      color: #ddd;
    }

    /* ----- Price Section ----- */
    .deal-card .price-section {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      position: relative;
      z-index: 1;
    }

    .deal-card .product-price {
      font-family: 'Poppins', 'Inter', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: #1E1E1E;
    }

    .deal-card .original-price {
      font-size: 13px;
      font-weight: 400;
      color: #aaa;
      text-decoration: line-through;
    }

    /* ----- Add to Cart Button ----- */
    .deal-card .add-to-cart {
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: linear-gradient(135deg, #6C63FF, #8B83F0);
      border: none;
      padding: 10px 22px;
      border-radius: 40px;
      color: white;
      font-family: 'Inter', 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
      box-shadow: 0 8px 24px rgba(108, 99, 255, 0.15);
      z-index: 5;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .deal-card .add-to-cart i {
      margin-right: 6px;
      font-size: 11px;
    }

    .deal-card:hover .add-to-cart {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .deal-card .add-to-cart:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 12px 32px rgba(108, 99, 255, 0.2);
    }

    .deal-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 29px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.05), transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 3;
    }

    .deal-card:hover::before {
      opacity: 1;
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media screen and (max-width: 768px) {
      .daily-deals-section {
        padding: 36px 20px 48px 20px;
        border-radius: 32px;
      }

      .daily-deals-header .title {
        font-size: 22px;
      }

      .daily-deals-header .title-icon {
        width: 38px;
        height: 38px;
        font-size: 17px;
      }

      .daily-deals-header .see-all {
        font-size: 13px;
        padding: 8px 16px;
      }

      .deal-card {
        flex: 0 0 175px;
        padding: 16px 14px 14px 14px;
        border-radius: 24px;
      }

      .deal-card .product-image-wrap {
        width: 100px;
        height: 100px;
      }

      .deal-card .product-name {
        font-size: 13px;
        min-height: 34px;
        margin-top: 8px;
      }

      .deal-card .product-price {
        font-size: 17px;
      }

      .deal-card .original-price {
        font-size: 12px;
      }

      .deal-card .discount-badge {
        font-size: 10px;
        padding: 3px 10px;
        top: 12px;
        left: 12px;
      }

      .deal-card .wishlist-btn {
        width: 30px;
        height: 30px;
        font-size: 12px;
        top: 10px;
        right: 10px;
      }

      .deal-card .add-to-cart {
        font-size: 11px;
        padding: 8px 16px;
        bottom: -14px;
      }

      .daily-deals-scroll {
        gap: 16px;
        padding: 12px 2px 22px 2px;
      }
    }

    @media screen and (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .daily-deals-section {
        padding: 28px 16px 40px 16px;
        border-radius: 28px;
      }

      .daily-deals-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 20px;
      }

      .daily-deals-header .title {
        font-size: 20px;
      }

      .daily-deals-header .title-icon {
        width: 34px;
        height: 34px;
        font-size: 15px;
        border-radius: 12px;
      }

      .daily-deals-header .see-all {
        font-size: 12px;
        padding: 6px 14px;
      }

      .deal-card {
        flex: 0 0 150px;
        padding: 14px 12px 12px 12px;
        border-radius: 22px;
      }

      .deal-card .product-image-wrap {
        width: 80px;
        height: 80px;
        margin-top: -4px;
      }

      .deal-card .product-name {
        font-size: 12px;
        min-height: 30px;
        margin-top: 6px;
      }

      .deal-card .product-price {
        font-size: 15px;
      }

      .deal-card .original-price {
        font-size: 11px;
      }

      .deal-card .discount-badge {
        font-size: 9px;
        padding: 2px 8px;
        top: 10px;
        left: 10px;
      }

      .deal-card .wishlist-btn {
        width: 26px;
        height: 26px;
        font-size: 11px;
        top: 8px;
        right: 8px;
      }

      .deal-card .rating {
        font-size: 10px;
      }

      .deal-card .add-to-cart {
        font-size: 10px;
        padding: 6px 14px;
        bottom: -12px;
      }

      .daily-deals-scroll {
        gap: 14px;
        padding: 8px 0 18px 0;
      }
    }

    @media screen and (max-width: 380px) {
      .deal-card {
        flex: 0 0 130px;
        padding: 12px 10px 10px 10px;
        border-radius: 20px;
      }

      .deal-card .product-image-wrap {
        width: 65px;
        height: 65px;
      }

      .deal-card .product-name {
        font-size: 11px;
        min-height: 26px;
      }

      .deal-card .product-price {
        font-size: 13px;
      }

      .deal-card .original-price {
        font-size: 10px;
      }

      .deal-card .discount-badge {
        font-size: 8px;
        padding: 2px 6px;
        top: 8px;
        left: 8px;
      }

      .deal-card .wishlist-btn {
        width: 22px;
        height: 22px;
        font-size: 9px;
        top: 6px;
        right: 6px;
      }

      .deal-card .add-to-cart {
        font-size: 9px;
        padding: 4px 10px;
        bottom: -10px;
      }
    }
  </style>
</head>

  <!-- ============================================================
  JAVASCRIPT - DRAG TO SCROLL + INTERACTIONS

  <script>
    (function() {
      const scrollContainer = document.getElementById('dealsScroll');

      // ---- Drag to scroll ----
      let isDragging = false;
      let startX = 0;
      let scrollLeftStart = 0;

      scrollContainer.addEventListener('mousedown', (e) => {
        isDragging = true;
        scrollContainer.classList.add('active');
        startX = e.pageX - scrollContainer.offsetLeft;
        scrollLeftStart = scrollContainer.scrollLeft;
        scrollContainer.style.cursor = 'grabbing';
        scrollContainer.style.scrollBehavior = 'auto';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - scrollContainer.offsetLeft;
        const walk = (x - startX) * 1.2;
        scrollContainer.scrollLeft = scrollLeftStart - walk;
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          scrollContainer.classList.remove('active');
          scrollContainer.style.cursor = 'grab';
          scrollContainer.style.scrollBehavior = 'smooth';
        }
      });

      // ---- Touch drag for mobile ----
      let touchStartX = 0;
      let touchScrollLeft = 0;

      scrollContainer.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].pageX - scrollContainer.offsetLeft;
        touchScrollLeft = scrollContainer.scrollLeft;
        scrollContainer.style.scrollBehavior = 'auto';
      }, { passive: true });

      scrollContainer.addEventListener('touchmove', (e) => {
        const x = e.touches[0].pageX - scrollContainer.offsetLeft;
        const walk = (x - touchStartX) * 1.2;
        scrollContainer.scrollLeft = touchScrollLeft - walk;
      }, { passive: true });

      scrollContainer.addEventListener('touchend', () => {
        scrollContainer.style.scrollBehavior = 'smooth';
      }, { passive: true });

      // ---- Wishlist toggle ----
      document.querySelectorAll('.deal-card .wishlist-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const icon = this.querySelector('i');
          if (icon.classList.contains('far')) {
            icon.classList.remove('far');
            icon.classList.add('fas');
            this.style.color = '#ff4757';
            this.style.background = 'rgba(255,71,87,0.06)';
            this.style.borderColor = 'rgba(255,71,87,0.1)';
          } else {
            icon.classList.remove('fas');
            icon.classList.add('far');
            this.style.color = '#999';
            this.style.background = 'rgba(0,0,0,0.02)';
            this.style.borderColor = 'rgba(0,0,0,0.04)';
          }
        });
      });

      // ---- Add to Cart ----
      document.querySelectorAll('.deal-card .add-to-cart').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const name = this.closest('.deal-card').querySelector('.product-name')?.textContent || 'Product';
          alert('🛒 Added to cart: ' + name);
          this.innerHTML = '<i class="fas fa-check"></i> Added';
          this.style.background = 'linear-gradient(135deg, #00b894, #00a381)';
          setTimeout(() => {
            this.innerHTML = '<i class="fas fa-plus"></i> Add to Cart';
            this.style.background = 'linear-gradient(135deg, #6C63FF, #8B83F0)';
          }, 2000);
        });
      });

      // ---- Card click ----
      document.querySelectorAll('.deal-card').forEach(card => {
        card.addEventListener('click', function(e) {
          if (e.target.closest('button')) return;
          const name = this.querySelector('.product-name')?.textContent || 'Product';
          alert('🛍️ Viewing: ' + name);
        });
      });

      // ---- See all ----
      document.querySelector('.daily-deals-header .see-all')?.addEventListener('click', function(e) {
        e.preventDefault();
        alert('✨ Showing all daily deals (demo)');
      });

    })();
  </script>

</body>
</html>
