<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurelia Bazar · animated navbar</title>
  <!-- Google Fonts: Poppins + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ---------- RESET & BASE ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #F5F6FA;
      font-family: 'Poppins', 'Inter', sans-serif;
      min-height: 100vh;
      padding: 0;
      margin: 0;
    }

    /* -------- NAVBAR (top, full-width, premium, animated) -------- */
    .navbar-wrapper {
      width: 100%;
      padding: 20px 20px 0 20px;
      background: transparent;
    }

    .navbar {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 40px;
      padding: 10px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.02);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      z-index: 50;
      animation: floatIn 0.8s ease-out forwards;
    }

    /* subtle floating animation on load */
    @keyframes floatIn {
      0% {
        opacity: 0;
        transform: translateY(-18px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* glow pulse on navbar (very subtle) */
    .navbar::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 42px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.08), rgba(108, 99, 255, 0.02));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: -1;
    }

    /* LEFT: Logo */
    .navbar .logo {
      font-size: 24px;
      font-weight: 700;
      color: #1E1E1E;
      letter-spacing: -0.3px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      position: relative;
    }

    .navbar .logo i {
      font-size: 1.2rem;
      color: #6C63FF;
      transition: transform 0.4s ease;
      display: inline-block;
    }

    .navbar .logo:hover i {
      transform: rotate(-12deg) scale(1.1);
    }

    .navbar .logo::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0%;
      height: 2.5px;
      background: linear-gradient(90deg, #6C63FF, #a29bfe);
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .navbar .logo:hover::after {
      width: 100%;
    }

    /* CENTER: nav links */
    .navbar .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .navbar .nav-links li {
      position: relative;
    }

    .navbar .nav-links li a {
      font-family: 'Inter', 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #444;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 40px;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      letter-spacing: 0.2px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      position: relative;
    }

    /* animated underline / pill effect */
    .navbar .nav-links li a::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 40px;
      background: rgba(108, 99, 255, 0.04);
      transform: scale(0.8);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: -1;
    }

    .navbar .nav-links li a:hover {
      color: #6C63FF;
      transform: translateY(-1px);
    }

    .navbar .nav-links li a:hover::before {
      transform: scale(1);
      opacity: 1;
    }

    /* active link style */
    .navbar .nav-links li a.active {
      color: #6C63FF;
      background: rgba(108, 99, 255, 0.08);
      box-shadow: 0 2px 12px rgba(108, 99, 255, 0.06);
    }

    .navbar .nav-links li a.active::before {
      transform: scale(1);
      opacity: 1;
      background: rgba(108, 99, 255, 0.06);
    }

    /* animated dot indicator */
    .navbar .nav-links li a .dot-indicator {
      width: 6px;
      height: 6px;
      background: #6C63FF;
      border-radius: 30px;
      display: inline-block;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s ease;
      margin-left: 2px;
    }

    .navbar .nav-links li a:hover .dot-indicator,
    .navbar .nav-links li a.active .dot-indicator {
      opacity: 1;
      transform: scale(1);
    }

    /* RIGHT: Icons */
    .navbar .nav-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .navbar .nav-icons a {
      color: #2c2c2c;
      font-size: 18px;
      width: 44px;
      height: 44px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      background: transparent;
      position: relative;
      cursor: pointer;
      border: none;
    }

    .navbar .nav-icons a i {
      font-size: 1.2rem;
      transition: transform 0.25s ease;
    }

    .navbar .nav-icons a:hover {
      color: #6C63FF;
      background: rgba(108, 99, 255, 0.06);
      transform: translateY(-2px);
    }

    .navbar .nav-icons a:hover i {
      transform: scale(1.08);
    }

    /* cart badge with bounce */
    .navbar .nav-icons .cart-wrapper {
      position: relative;
    }

    .navbar .nav-icons .cart-wrapper .badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: #6C63FF;
      color: white;
      font-size: 10px;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 12px rgba(108, 99, 255, 0.3);
      animation: badgePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transition: transform 0.2s ease;
    }

    .navbar .nav-icons .cart-wrapper:hover .badge {
      transform: scale(1.15);
    }

    @keyframes badgePop {
      0% {
        transform: scale(0) rotate(-10deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* hamburger (hidden on desktop) */
    .navbar .hamburger {
      display: none;
      background: transparent;
      border: none;
      font-size: 24px;
      color: #1E1E1E;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 60px;
      transition: all 0.3s ease;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
    }

    .navbar .hamburger:hover {
      background: rgba(108, 99, 255, 0.04);
      color: #6C63FF;
    }

    .navbar .hamburger i {
      transition: transform 0.4s ease;
    }

    .navbar .hamburger.active i {
      transform: rotate(90deg);
    }

    /* -------- SEARCH OVERLAY (working) -------- */
    .search-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.35s ease;
      padding: 20px;
    }

    .search-overlay.active {
      display: flex;
      opacity: 1;
    }

    .search-overlay .search-container {
      background: #ffffff;
      border-radius: 60px;
      padding: 12px 20px 12px 32px;
      max-width: 560px;
      width: 100%;
      display: flex;
      align-items: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.08), 0 10px 30px rgba(0, 0, 0, 0.02);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .search-overlay.active .search-container {
      transform: scale(1);
    }

    .search-overlay .search-container i {
      color: #6C63FF;
      font-size: 1.2rem;
      margin-right: 14px;
      opacity: 0.8;
    }

    .search-overlay .search-container input {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'Inter', 'Poppins', sans-serif;
      font-size: 1.1rem;
      padding: 14px 0;
      background: transparent;
      color: #1E1E1E;
    }

    .search-overlay .search-container input::placeholder {
      color: #aaa;
      font-weight: 400;
    }

    .search-overlay .search-container .close-search {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      color: #888;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 40px;
      transition: all 0.2s ease;
    }

    .search-overlay .search-container .close-search:hover {
      background: rgba(108, 99, 255, 0.06);
      color: #6C63FF;
      transform: rotate(90deg);
    }

    /* -------- RESPONSIVE (mobile) -------- */
    @media screen and (max-width: 820px) {
      .navbar-wrapper {
        padding: 16px 16px 0 16px;
      }

      .navbar {
        padding: 10px 18px;
        border-radius: 32px;
      }

      .navbar .nav-links {
        display: none;
        position: absolute;
        top: calc(100% + 12px);
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 32px;
        padding: 20px 18px;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        box-shadow: 0 24px 56px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.5);
        animation: slideDown 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        transform-origin: top center;
        z-index: 100;
      }

      @keyframes slideDown {
        0% {
          opacity: 0;
          transform: scale(0.96) translateY(-12px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .navbar .nav-links.open {
        display: flex;
      }

      .navbar .nav-links li a {
        padding: 12px 18px;
        width: 100%;
        border-radius: 28px;
        font-size: 15px;
        justify-content: flex-start;
      }

      .navbar .nav-links li a .dot-indicator {
        margin-left: auto;
      }

      .navbar .hamburger {
        display: flex;
        margin-left: 4px;
      }

      .navbar .nav-icons a {
        width: 40px;
        height: 40px;
        font-size: 16px;
      }

      .navbar .logo {
        font-size: 20px;
      }

      .search-overlay .search-container {
        padding: 8px 16px 8px 24px;
        border-radius: 40px;
      }
      .search-overlay .search-container input {
        font-size: 1rem;
        padding: 12px 0;
      }
    }

    @media screen and (max-width: 460px) {
      .navbar-wrapper {
        padding: 12px 12px 0 12px;
      }
      .navbar {
        padding: 8px 14px;
        border-radius: 28px;
      }
      .navbar .logo {
        font-size: 18px;
      }
      .navbar .logo i {
        font-size: 1rem;
      }
      .navbar .nav-icons a {
        width: 36px;
        height: 36px;
        font-size: 14px;
      }
      .navbar .nav-icons {
        gap: 2px;
      }
      .navbar .hamburger {
        width: 38px;
        height: 38px;
        font-size: 20px;
      }
      .navbar .nav-icons .cart-wrapper .badge {
        width: 18px;
        height: 18px;
        font-size: 9px;
        top: 0px;
        right: 0px;
      }
      .search-overlay .search-container {
        padding: 6px 12px 6px 18px;
        border-radius: 32px;
      }
      .search-overlay .search-container input {
        font-size: 0.95rem;
        padding: 10px 0;
      }
      .search-overlay .search-container .close-search {
        font-size: 1.2rem;
        padding: 4px 8px;
      }
    }

    /* -------- PAGE CONTENT (to show navbar at top) -------- */
    .page-content {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 0 20px;
    }

    .hero-banner {
      background: #ffffff;
      border-radius: 32px;
      padding: 60px 48px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.02);
      text-align: center;
    }

    .hero-banner h1 {
      font-size: 2.6rem;
      font-weight: 700;
      color: #1E1E1E;
      margin-bottom: 8px;
    }

    .hero-banner h1 span {
      color: #6C63FF;
    }

    .hero-banner p {
      color: #666;
      font-size: 1.1rem;
      max-width: 500px;
      margin: 12px auto 0;
    }

    .demo-note {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #aaa;
      letter-spacing: 0.3px;
      text-align: center;
      background: rgba(255, 255, 255, 0.5);
      padding: 6px 20px;
      border-radius: 60px;
      display: inline-block;
      backdrop-filter: blur(4px);
    }

    @media (max-width: 600px) {
      .hero-banner {
        padding: 36px 20px;
      }
      .hero-banner h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  </script>

</body>
</html>
